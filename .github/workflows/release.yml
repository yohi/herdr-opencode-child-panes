name: Release

on:
  push:
    branches:
      - master
  release:
    types: [published]

permissions: {}

jobs:
  release-please:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@c3fc4de07084f75a2b61a5b933069bda6edf3d5c # v4
        id: release
        with:
          release-type: node
          target-branch: master

  publish:
    needs: release-please
    if: >-
      ${{ always() && (github.event_name == 'release' ||
      needs.release-please.outputs.release_created == 'true') }}
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || needs.release-please.outputs.tag_name }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm run test

      - name: Build plugin
        run: npm run build

      - name: Configure GitHub Packages
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          registry-url: "https://npm.pkg.github.com"
          scope: "@${{ github.repository_owner }}"

      - name: Publish to GitHub Packages
        run: |
          PACKAGE_SPEC=$(node -p 'const packageJson = require("./package.json"); packageJson.name + "@" + packageJson.version')
          if npm view "$PACKAGE_SPEC" version --registry="https://npm.pkg.github.com" >/dev/null 2>&1; then
            echo "$PACKAGE_SPEC is already published; skipping npm publish"
          else
            npm publish --ignore-scripts
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Pack and upload release asset
        run: |
          PACKAGE_FILE=$(npm pack)
          gh release upload --clobber "$TAG_NAME" "$PACKAGE_FILE"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event_name == 'release' && github.event.release.tag_name || needs.release-please.outputs.tag_name }}
